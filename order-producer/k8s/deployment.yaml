apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-producer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-producer
  template:
    metadata:
      labels:
        app: order-producer
    spec:
      containers:
        - name: order-producer
          image: 482604438475.dkr.ecr.eu-west-1.amazonaws.com/order-producer:1.0
          ports:
            - containerPort: 8080